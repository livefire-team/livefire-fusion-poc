name: load-generator

# Same shape as order-service.yml (ADR-011): pull requests (any base branch) run `test` and `image` only, with
# read-only tokens. Pushes to main also run `publish`, which pushes the exact image that `image` smoke-tested to GHCR
# as :sha-<short sha> and :g2 (ADR-015). Actions are pinned to full commit SHAs.
on:
  push:
    branches: [main]
    paths: ['src/load-generator/**', '.github/workflows/load-generator.yml']
  pull_request:
    paths: ['src/load-generator/**', '.github/workflows/load-generator.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: load-generator-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r src/load-generator/requirements-dev.txt
      - name: Unit tests with coverage
        run: pytest -q src/load-generator --cov=src/load-generator/loadgen --cov-fail-under=80

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      image-id: ${{ steps.save.outputs.image-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t load-generator:ci src/load-generator
      # No order service in CI: the container has no network, so every order fails and goes to the backlog.
      # The run must still end cleanly after DURATION_SECONDS, as a non-root user; bad settings must exit 2.
      - name: Smoke test
        run: |
          uid=$(docker run --rm --entrypoint id load-generator:ci -u)
          echo "runs as uid $uid"
          [ "$uid" != "0" ] || { echo "image runs as root"; exit 1; }
          set +e
          docker run --rm --network none -e ORDER_APP_URL=ftp://invalid load-generator:ci
          code=$?
          set -e
          echo "invalid settings -> exit $code"
          [ "$code" = "2" ] || { echo "expected exit 2 for invalid settings"; exit 1; }
          docker run --rm --network none \
            -e ORDER_APP_URL=http://127.0.0.1:9 -e RATE_PER_MINUTE=120 -e DURATION_SECONDS=3 \
            -e RETRY_BASE_SECONDS=1 load-generator:ci 2>&1 | tee run.log
          grep -E 'loadgen status sent=[1-9][0-9]* backlog=[1-9]' run.log
      - name: Save the tested image
        id: save
        run: |
          echo "image-id=$(docker image inspect --format '{{.Id}}' load-generator:ci)" >> "$GITHUB_OUTPUT"
          docker save load-generator:ci | gzip > load-generator-image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-generator-image
          path: load-generator-image.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: load-generator-image
      - name: Load the tested image and check it is the same one
        env:
          EXPECTED_ID: ${{ needs.image.outputs.image-id }}
        run: |
          gunzip -c load-generator-image.tar.gz | docker load
          actual=$(docker image inspect --format '{{.Id}}' load-generator:ci)
          echo "expected $EXPECTED_ID, loaded $actual"
          [ -n "$EXPECTED_ID" ] && [ "$actual" = "$EXPECTED_ID" ] || { echo "image ID mismatch"; exit 1; }
      - name: Image name and tags (GHCR needs lowercase)
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/load-generator" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push :sha-<short sha> and :g2
        run: |
          docker tag load-generator:ci "$IMAGE:sha-$SHORT_SHA"
          docker tag load-generator:ci "$IMAGE:g2"
          docker push "$IMAGE:sha-$SHORT_SHA"
          docker push "$IMAGE:g2"
