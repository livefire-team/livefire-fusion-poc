name: referee

# Runs referee/tests: the SQL check, the job entry point and the WS2 scripts, driven through fake commands, so no
# Azure or database is needed. On pushes to main it also builds the Referee image (the pinned journey inside),
# publishes it to GHCR as :sha-<short sha>, and to the lab's private registry as :sha-<full sha> when the acr-push
# environment is set up (scripts/deploy.sh github). Actions are pinned to full commit SHAs (ADR-011).
on:
  pull_request:
    paths: ['referee/**', 'journeys/**', 'scripts/**', '.github/workflows/referee.yml']
  push:
    branches: [main]
    paths: ['referee/**', 'journeys/**', 'scripts/**', '.github/workflows/referee.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: referee-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pytest at the referee's pinned version
        run: pip install "$(grep '^pytest==' referee/requirements.txt)"
      - name: Run the referee tests
        run: python -m pytest referee/tests -q

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      image-id: ${{ steps.save.outputs.image-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --build-arg "GIT_SHA=$GITHUB_SHA" -t referee:ci -f referee/Dockerfile .
      - name: Smoke test (imports, browser, ODBC driver, refuses a bad run)
        run: |
          docker run --rm referee:ci python -c "import playwright, pyodbc, azure.storage.blob; print('imports ok')"
          docker run --rm referee:ci bash -c "odbcinst -q -d | grep -q 'ODBC Driver 18' && echo 'odbc ok'"
          rc=0; docker run --rm referee:ci || rc=$?
          [ "$rc" = 2 ] || { echo "a run without settings must exit 2, got $rc"; exit 1; }
      - name: Save the tested image
        id: save
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "image-id=$(docker image inspect --format '{{.Id}}' referee:ci)" >> "$GITHUB_OUTPUT"
          docker save referee:ci | gzip > referee-image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: referee-image
          path: referee-image.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: referee-image
      - name: Load the tested image and check it is the same one
        env:
          EXPECTED_ID: ${{ needs.image.outputs.image-id }}
        run: |
          gunzip -c referee-image.tar.gz | docker load
          [ "$(docker image inspect --format '{{.Id}}' referee:ci)" = "$EXPECTED_ID" ] || { echo "image ID mismatch"; exit 1; }
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push :sha-<short sha>
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/referee:sha-${GITHUB_SHA::7}"
          docker tag referee:ci "$IMAGE" && docker push "$IMAGE"

  acr:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: acr-push
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: referee-image
      - name: Push :sha-<full sha> to the lab registry (OIDC, no stored secret)
        env:
          EXPECTED_ID: ${{ needs.image.outputs.image-id }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ACR_NAME: ${{ vars.ACR_NAME }}
          ACR_SERVER: ${{ vars.ACR_SERVER }}
        run: |
          if [ -z "$ACR_NAME" ]; then echo "no lab registry configured; run scripts/deploy.sh github"; exit 0; fi
          gunzip -c referee-image.tar.gz | docker load
          [ "$(docker image inspect --format '{{.Id}}' referee:ci)" = "$EXPECTED_ID" ] || { echo "image ID mismatch"; exit 1; }
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          az login --service-principal -u "$AZURE_CLIENT_ID" -t "$AZURE_TENANT_ID" --federated-token "$token" \
            --allow-no-subscriptions -o none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          az acr login -n "$ACR_NAME"
          docker tag referee:ci "$ACR_SERVER/referee:sha-$GITHUB_SHA"
          docker push "$ACR_SERVER/referee:sha-$GITHUB_SHA"
