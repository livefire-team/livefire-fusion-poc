name: drill-runner

on:
  push:
    branches: [main]
    paths: ['src/drill-runner/**', 'contracts/**', '.github/workflows/drill-runner.yml']
  pull_request:
    paths: ['src/drill-runner/**', 'contracts/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Contract, policy and workflow tests (all stubs, no Azure)
        run: |
          pip install -r src/drill-runner/requirements-dev.txt
          cd src/drill-runner && pytest -q

      - name: Agent definitions build
        run: python scripts/create_agents.py --dry-run > /dev/null

      - name: Image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/drill-runner" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: src/drill-runner
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
