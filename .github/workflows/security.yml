name: security

# Security scans (ADR-013). Runs on every pull request (any base branch, so stacked PRs are checked too) and on
# pushes to main. Each scan is its own job with a read-only token; only `codeql` may write code-scanning results.
# Fail policy: secrets and CodeQL alerts fail the job; dependency and image scans fail on HIGH or CRITICAL
# vulnerabilities that have a fixed version available. Actions are pinned to full commit SHAs, and the gitleaks and
# Trivy release binaries are checked against fixed SHA-256 checksums before they run.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  TRIVY_VERSION: 0.76.1
  TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
  PIP_AUDIT_VERSION: 2.10.1

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (release binary, checksum verified)
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tar.gz
      - name: Scan the full git history for secrets
        run: |
          "$RUNNER_TEMP/gitleaks" version
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --verbose --exit-code 1 .

  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install "pip-audit==${PIP_AUDIT_VERSION}"
      - name: Audit the order service's pinned dependencies
        run: |
          pip-audit --desc on \
            -r src/order-service/requirements.txt \
            -r src/order-service/requirements-dev.txt
      - name: Audit the load generator's pinned dependencies
        run: |
          pip-audit --desc on \
            -r src/load-generator/requirements.txt \
            -r src/load-generator/requirements-dev.txt

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:python

  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Trivy (release binary, checksum verified)
        run: |
          curl -fsSL -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz -C "$RUNNER_TEMP" trivy
          rm trivy.tar.gz
          "$RUNNER_TEMP/trivy" --version
      - name: Scan the repository (dependencies and config such as the Dockerfile)
        run: |
          "$RUNNER_TEMP/trivy" fs --scanners vuln,misconfig \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .
      - name: Build the order-service image
        run: docker build -t order-service:scan src/order-service
      - name: Scan the order-service image
        run: |
          "$RUNNER_TEMP/trivy" image --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 order-service:scan
      - name: Build the load-generator image
        run: docker build -t load-generator:scan src/load-generator
      - name: Scan the load-generator image
        run: |
          "$RUNNER_TEMP/trivy" image --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 load-generator:scan
